<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Detec&ccedil;&atilde;o de movimento</title>
<!--
  Sintonia do detector de movimento, servida pelo vmsserver em /ui/motion e
  aberta em iframe pela casca do app.

  ## O que esta tela e

  Um video tocando, e uma barra de sensibilidade embaixo. Ve-se o movimento
  acontecer e decide-se, ali, se AQUILO devia contar como movimento.

  A versao anterior era um grafico de scores com miniaturas quadro a quadro.
  Tinha toda a informacao e nenhuma resposta: para saber se o pico das 14h32 era
  a arvore no vento ou uma pessoa, era preciso reconstruir a cena olhando imagem
  parada por imagem parada. O video responde isso sozinho.

  ## Por que a barra reclassifica sem voltar ao servidor

  O score de um quadro NAO depende do limiar: ele e a fracao do quadro que
  mudou. O limiar so decide o que fazer com esse numero. Entao arrastar a barra
  e recolorir o que ja esta na tela, instantaneo, e o ensaio no servidor roda uma
  vez por trecho em vez de uma vez por ajuste.

  A regra e a mesma do detector (ver Vms.Analytics.Motion): acima do limiar de
  CENA nao e movimento, e mudanca de luz, infravermelho ou camera empurrada;
  abaixo dele, e movimento se passar do limiar.

  Sem nada de fora: nenhum script, fonte ou folha de estilo remota. O servidor
  costuma rodar numa rede sem saida para a internet, e uma pagina que depende de
  CDN so falharia la.

  ASCII puro no fonte, acento por entidade HTML na marcacao e por escape unicode
  nas strings de JavaScript. O texto daqui vira literal de string Pascal (ver
  tools/gen_ui_pas.py).
-->
<style>
  /* Os mesmos tokens da casca do app (ver app-ui.html): esta pagina abre dentro
     dela, e duas paletas na mesma tela denunciam a costura. */
  :root {
    color-scheme: dark;
    --p:#8ed0f0; --sobre-p:#00344a; --sec-cont:#334b53; --sobre-sec-cont:#cfe7ef;
    --sup:#121212; --sup1:#1a1a1a; --sup2:#1f1f1f; --sup3:#282828;
    --sobre-sup:#e6e6e6; --sobre-sup-var:#c2c7c9;
    --contorno:#8b9194; --contorno-var:#3f4447;
    --erro:#ffb4ab; --ok:#7ee2a8; --alerta:#f2c14e;
  }
  html, body { height:100%; }
  body { margin:0; background:var(--sup); color:var(--sobre-sup);
         font:400 14px/20px Roboto, system-ui, "Segoe UI", sans-serif;
         -webkit-tap-highlight-color:transparent; overflow:hidden;
         display:flex; flex-direction:column; }

  header { flex:0 0 auto; display:flex; align-items:center; gap:8px;
           padding:8px 12px; background:var(--sup1); flex-wrap:wrap; }
  h1 { font:400 20px/28px Roboto, system-ui, sans-serif; margin:0 4px 0 0; }

  select, input[type=datetime-local] {
    background:var(--sup3); color:var(--sobre-sup);
    border:1px solid var(--contorno-var); border-radius:4px;
    padding:7px 9px; font:inherit; }
  select:focus, input:focus { outline:none; border-color:var(--p); }

  button.b {
    background:none; color:var(--p); border:1px solid var(--contorno-var);
    border-radius:20px; padding:8px 16px; min-height:40px; box-sizing:border-box;
    font:500 14px/20px Roboto, system-ui, sans-serif; cursor:pointer;
    white-space:nowrap; }
  button.b.on { background:var(--p); border-color:transparent; color:var(--sobre-p); }
  button.b.tonal { background:var(--sec-cont); border-color:transparent;
                   color:var(--sobre-sec-cont); }
  button.b[disabled] { opacity:.38; cursor:default; }

  /* ------------------------------------------------------------- o video */
  #palco { flex:1 1 auto; min-height:140px; background:#000; position:relative;
           display:flex; align-items:center; justify-content:center;
           overflow:hidden; }
  #tela2d { width:100%; height:100%; object-fit:contain; display:block; }
  /* A caixa do que mudou vai num canvas POR CIMA: o de baixo e do player, que
     repinta a cada quadro e apagaria qualquer desenho nosso. */
  #caixa { position:absolute; inset:0; width:100%; height:100%;
           pointer-events:none; }
  #aviso { position:absolute; color:var(--sobre-sup-var); font-size:13px;
           padding:10px 16px; text-align:center; background:rgba(0,0,0,.55);
           border-radius:12px; max-width:80%; }
  #aviso:empty { display:none; }

  /* O veredito, grande, sobre o video: e a resposta que esta tela existe para
     dar, e nao cabe numa tabela de estatistica no canto. */
  #selo { position:absolute; left:12px; top:12px; display:flex;
          align-items:center; gap:10px; padding:8px 14px; border-radius:20px;
          background:rgba(18,18,18,.62);
          -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
          font:500 14px/20px Roboto, system-ui, sans-serif; }
  #selo .bolha { width:12px; height:12px; border-radius:50%;
                 background:var(--contorno); flex:0 0 auto; }
  #selo.mexeu .bolha { background:var(--ok);
                       box-shadow:0 0 0 5px rgba(126,226,168,.20); }
  #selo.cena .bolha { background:var(--alerta); }
  #selo .n { color:var(--sobre-sup-var); font-variant-numeric:tabular-nums; }

  /* ------------------------------------------------------- a barra de score
     Faz dois papeis de uma vez: e o grafico do trecho analisado E a regua da
     reproducao. Eram duas coisas separadas antes, e ficar olhando de uma para a
     outra era metade da dificuldade. */
  #faixa { flex:0 0 auto; background:var(--sup1); padding:6px 8px 0; }
  #curva { width:100%; height:84px; display:block; cursor:pointer;
           touch-action:none; }

  #ctrl { flex:0 0 auto; display:flex; align-items:center; gap:8px;
          padding:8px 12px; background:var(--sup1); flex-wrap:wrap; }
  #relogio { font-variant-numeric:tabular-nums;
             font:500 15px/20px ui-monospace, Consolas, monospace;
             margin-left:auto; }

  /* ------------------------------------------------------ a sensibilidade */
  #ajuste { flex:0 0 auto; padding:10px 12px 12px; background:var(--sup2);
            overflow-y:auto; max-height:46vh; }
  .linha { display:flex; align-items:baseline; gap:8px; }
  .linha .rot { font:500 14px/20px Roboto, system-ui, sans-serif; }
  .linha .val { margin-left:auto; font-variant-numeric:tabular-nums;
                color:var(--p); font-weight:500; }
  input[type=range] { width:100%; margin:8px 0 0; accent-color:var(--p);
                      height:28px; }
  .escala { display:flex; justify-content:space-between;
            color:var(--sobre-sup-var);
            font:400 11px/16px Roboto, system-ui, sans-serif; }
  .dica { color:var(--sobre-sup-var);
          font:400 12px/16px Roboto, system-ui, sans-serif; margin-top:8px; }
  .dica b { color:var(--sobre-sup); }
  .err { color:var(--erro); }
  .warn { color:var(--alerta); }

  details { margin-top:12px; }
  summary { color:var(--p); font:500 13px/18px Roboto, system-ui, sans-serif;
            cursor:pointer; padding:4px 0; }
  .trecho { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
            margin-top:10px; }
  .trecho label { color:var(--sobre-sup-var); font-size:12px; }

  #acoes { flex:0 0 auto; display:flex; gap:12px; align-items:center;
           padding:0 12px 12px; background:var(--sup2); flex-wrap:wrap; }
  #msg { color:var(--sobre-sup-var); font-size:12px; }
</style>

<header>
  <h1>Movimento</h1>
  <select id="cam"></select>
  <button class="b tonal" id="ult">&Uacute;ltimos 30 min</button>
  <button class="b tonal" id="varrer">Procurar nas 6 h</button>
</header>

<div id="palco">
  <canvas id="tela2d"></canvas>
  <canvas id="caixa"></canvas>
  <div id="selo"><span class="bolha"></span><span id="veredito">&mdash;</span>
    <span class="n" id="scoreAgora"></span></div>
  <div id="aviso">carregando...</div>
</div>

<div id="faixa"><canvas id="curva"></canvas></div>

<div id="ctrl">
  <button class="b" id="tocar">Tocar</button>
  <select id="vel">
    <option value="1">1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
  </select>
  <span id="relogio">--:--:--</span>
</div>

<div id="ajuste">
  <div class="linha">
    <span class="rot">Sensibilidade</span>
    <span class="val" id="vlim">&mdash;</span>
  </div>
  <input type="range" id="lim" min="0" max="1000" step="1" value="500">
  <div class="escala"><span>pega menos</span><span>pega mais</span></div>
  <div class="dica" id="resumo">&mdash;</div>

  <details>
    <summary>Ajuste fino</summary>
    <div class="linha" style="margin-top:8px">
      <span class="rot">Cena nova acima de</span>
      <span class="val" id="vcena">&mdash;</span>
    </div>
    <input type="range" id="cena" min="20" max="100" step="1" value="85">
    <div class="dica">Mudan&ccedil;a que toma o quadro inteiro &mdash; luz
      acendendo, infravermelho entrando, c&acirc;mera empurrada &mdash; n&atilde;o
      &eacute; movimento. Acima deste valor o quadro &eacute; descartado em vez de
      virar evento.</div>

    <div class="trecho">
      <label>de <input type="datetime-local" id="de" step="1"></label>
      <label>at&eacute; <input type="datetime-local" id="ate" step="1"></label>
      <button class="b" id="ir">Analisar</button>
    </div>
  </details>
</div>

<div id="acoes">
  <button class="b on" id="aplicar">Aplicar no servidor</button>
  <span id="msg"></span>
</div>

<script src="/ui/vmsreader.js"></script>
<script src="/ui/player.js"></script>
<script>
"use strict";

function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function hhmmss(ms) {
  var d = new Date(ms);
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function paraInput(ms) {
  var d = new Date(ms);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
         "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" +
         pad(d.getSeconds());
}
function doInput(v) { return v ? new Date(v).getTime() : 0; }

var Q = new URLSearchParams(location.search);
var CAM_INICIAL = Q.get("camera") || "";
var DE_INICIAL = parseInt(Q.get("fromMs") || "0", 10);
var ATE_INICIAL = parseInt(Q.get("toMs") || "0", 10);
// Qual servidor responde. Vazio = quem serviu a pagina; com valor, o servidor
// local do app encaminha para o cadastrado com esse nome.
var SERVIDOR = Q.get("server") || "";

function api(caminho) {
  if (!SERVIDOR) return caminho;
  return caminho + (caminho.indexOf("?") >= 0 ? "&" : "?") +
         "server=" + encodeURIComponent(SERVIDOR);
}

var cam = "";
var amostras = [];        // {ms, score, sceneChanged, box}
var janela = null;        // {t0, t1} do trecho analisado
var FIM_GRAVADO = {};
var tocador = null, posAtual = 0;
var varrendo = false;

function msg(t, cls) {
  $("msg").textContent = t || "";
  $("msg").className = cls || "";
}

// ------------------------------------------------------ limiar e a barra
//
// A barra e exponencial. A decisao acontece entre 0,1% e 2% do quadro -- o resto
// da faixa e "nunca dispara" ou "dispara com tudo" --, e num passo linear essa
// regiao inteira caberia em meia duzia de pixels.
//
// E ela e de SENSIBILIDADE, nao de limiar: para a direita pega mais coisa. O
// limiar por baixo anda ao contrario, e por isso o (1000 - v).
var LIM_MIN = 0.0002, LIM_MAX = 0.30;

function limiarDoSlider(v) {
  var a = Math.log(LIM_MIN), b = Math.log(LIM_MAX);
  return Math.exp(a + (b - a) * ((1000 - v) / 1000));
}
function sliderDoLimiar(x) {
  var a = Math.log(LIM_MIN), b = Math.log(LIM_MAX);
  x = Math.min(LIM_MAX, Math.max(LIM_MIN, x || LIM_MIN));
  return Math.round(1000 - 1000 * (Math.log(x) - a) / (b - a));
}
function limiar() { return limiarDoSlider(+$("lim").value); }
function cenaLimiar() { return (+$("cena").value) / 100; }

// A MESMA regra do detector, em Vms.Analytics.Motion: cena nova primeiro, e o
// que sobra e movimento se passar do limiar. Ter a regra dos dois lados e o que
// permite a barra reclassificar sem voltar ao servidor.
function classificar(a) {
  if (a.score >= cenaLimiar()) return "cena";
  return a.score >= limiar() ? "mexeu" : "parado";
}

// ------------------------------------------------------------- a camera
function carregarCameras() {
  return fetch(api("/api/cameras")).then(function (r) { return r.json(); })
    .then(function (j) {
      var sel = $("cam");
      sel.innerHTML = "";
      (j.cameras || []).forEach(function (c) {
        var o = document.createElement("option");
        o.value = c.name; o.textContent = c.name;
        sel.appendChild(o);
        if (c.lastMs) FIM_GRAVADO[c.name] = c.lastMs;
      });
      if (!sel.options.length) throw new Error("nenhuma c\u00e2mera");
      if (CAM_INICIAL)
        for (var i = 0; i < sel.options.length; i++)
          if (sel.options[i].value === CAM_INICIAL) { sel.selectedIndex = i; break; }
      cam = sel.value;
    });
}

// Os limiares que o servidor esta usando AGORA. Comecar neles evita a armadilha
// de mexer na barra achando que se partiu do que esta valendo.
function carregarLimiares() {
  return fetch(api("/api/settings")).then(function (r) { return r.json(); })
    .then(function (j) {
      var mapa = {};
      (j.settings || []).forEach(function (s) { mapa[s.key] = s.value; });
      var lim = parseFloat(mapa["analytics.motionThreshold"]);
      var cn = parseFloat(mapa["analytics.sceneChangeThreshold"]);
      if (lim > 0) $("lim").value = sliderDoLimiar(lim);
      if (cn > 0) $("cena").value = Math.round(cn * 100);
    }).catch(function () { /* sem settings: ficam os padroes da pagina */ });
}

// ------------------------------------------------------------- o ensaio
function pedir(de, ate) {
  var u = "/api/motion/probe?camera=" + encodeURIComponent(cam) +
          "&fromMs=" + de + "&toMs=" + ate + "&stepMs=2000" +
          "&threshold=" + limiar().toFixed(6) +
          "&sceneThreshold=" + cenaLimiar().toFixed(3);
  return fetch(api(u)).then(function (r) { return r.json(); });
}

function analisar(de, ate) {
  cam = $("cam").value;
  if (!cam || !de || ate <= de) { msg("intervalo inv\u00e1lido", "warn"); return; }
  varrendo = false;
  $("ir").disabled = true;
  msg("analisando o trecho...");
  janela = { t0: de, t1: ate };
  amostras = [];
  desenharCurva();
  pedir(de, ate).then(function (j) {
    $("ir").disabled = false;
    if (j.error) { msg(j.error, "err"); return; }
    amostras = j.samples || [];
    if (!amostras.length) {
      msg("sem grava\u00e7\u00e3o nesse trecho", "warn");
      $("aviso").textContent = "sem grava\u00e7\u00e3o nesse trecho";
      return;
    }
    msg(amostras.length + " quadros analisados");
    atualizarResumo();
    desenharCurva();
    abrirVideo(de);
  }).catch(function (e) {
    $("ir").disabled = false;
    msg("falhou: " + e, "err");
  });
}

function ultimos(min) {
  // Um minuto atras porque a ponta ainda grava; mas nunca depois do fim do que
  // existe, senao a janela cai no vazio.
  var ate = Date.now() - 60000;
  var fim = FIM_GRAVADO[$("cam").value];
  if (fim && fim < ate) ate = fim;
  var de = ate - min * 60000;
  $("de").value = paraInput(de);
  $("ate").value = paraInput(ate);
  analisar(de, ate);
}

// Procurar ONDE houve movimento, em pedacos de uma hora, desenhando conforme
// chega. Sintonizar exige um trecho em que algo aconteceu, e adivinhar horario
// nao converge.
function varrer(horas) {
  if (varrendo) { varrendo = false; return; }
  cam = $("cam").value;
  if (!cam) { msg("escolha uma c\u00e2mera", "warn"); return; }
  var ate = Date.now() - 60000;
  var fim = FIM_GRAVADO[cam];
  if (fim && fim < ate) ate = fim;
  var de = ate - horas * 3600000;
  $("de").value = paraInput(de);
  $("ate").value = paraInput(ate);
  janela = { t0: de, t1: ate };
  amostras = [];
  desenharCurva();
  varrendo = true;
  $("varrer").textContent = "Parar";
  var at = de;

  function proximo() {
    if (!varrendo || at >= ate) { terminar(); return; }
    var fimPedaco = Math.min(ate, at + 3600000);
    msg("procurando... " + hhmmss(at));
    pedir(at, fimPedaco).then(function (j) {
      if (!varrendo) { terminar(); return; }
      amostras = amostras.concat(j.samples || []);
      atualizarResumo();
      desenharCurva();
      at = fimPedaco;
      proximo();
    }).catch(function (e) { msg("falhou: " + e, "err"); terminar(); });
  }

  function terminar() {
    varrendo = false;
    $("varrer").textContent = "Procurar nas 6 h";
    if (!amostras.length) { msg("nada gravado nessas horas", "warn"); return; }
    var pico = amostras[0];
    amostras.forEach(function (a) { if (a.score > pico.score) pico = a; });
    msg("toque num pico da barra para assistir");
    // Ja abre no maior: e quase sempre o que se quer olhar primeiro.
    abrirVideo(Math.max(janela.t0, pico.ms - 5000));
  }

  proximo();
}

// ------------------------------------------------------------- o video
function garantirTocador() {
  if (tocador) return;
  tocador = new Player({
    base: "",
    escopo: function () { return SERVIDOR; },
    canvas: $("tela2d"),
    onEstado: function (tipo, m) {
      if (tipo === "erro" || tipo === "aviso") $("aviso").textContent = m;
    },
    onPosicao: function (ms) {
      posAtual = ms;
      $("aviso").textContent = "";
      $("relogio").textContent = hhmmss(ms);
      atualizarSelo();
      desenharCurva();
    }
  });
}

function abrirVideo(ms) {
  var motivo = Player.motivoIndisponivel ? Player.motivoIndisponivel() : "";
  if (motivo) { $("aviso").textContent = motivo; return; }
  garantirTocador();
  $("aviso").textContent = "abrindo...";
  tocador.abrir(cam, Math.round(ms));
  tocador.setVelocidade(+$("vel").value);
  tocador.setMudo(true);          // sintonia e olhar, nao ouvir
  $("tocar").textContent = "Pausar";
}

// A amostra que descreve o instante que esta na tela.
//
// Elas sao esparsas: o ensaio so enxerga keyframe, entao numa camera de GOP 4 s
// ha uma amostra a cada 4 s por mais fino que seja o passo pedido. Vale a mais
// proxima, e so ate um passo de distancia -- carimbar um instante com o veredito
// de outro seria pior do que dizer que nao ha veredito.
function amostraDe(ms) {
  if (!amostras.length) return null;
  var melhor = null, dist = Infinity;
  for (var i = 0; i < amostras.length; i++) {
    var d = Math.abs(amostras[i].ms - ms);
    if (d < dist) { dist = d; melhor = amostras[i]; }
  }
  return dist <= (espacamento() || 4000) ? melhor : null;
}

function espacamento() {
  if (amostras.length < 2) return 0;
  return (amostras[amostras.length - 1].ms - amostras[0].ms) / (amostras.length - 1);
}

function atualizarSelo() {
  var a = amostraDe(posAtual);
  var selo = $("selo");
  if (!a) {
    selo.className = "";
    $("veredito").textContent = "sem amostra aqui";
    $("scoreAgora").textContent = "";
    desenharCaixa(null);
    return;
  }
  var q = classificar(a);
  selo.className = (q === "parado") ? "" : q;
  $("veredito").textContent = q === "mexeu" ? "MOVIMENTO"
                            : (q === "cena" ? "cena nova" : "parado");
  $("scoreAgora").textContent = (a.score * 100).toFixed(2) + "%";
  desenharCaixa(q === "mexeu" ? a.box : null);
}

// A caixa do que mudou, por cima do video. Vem normalizada 0..1 sobre o QUADRO,
// entao tem de ser mapeada para onde a imagem esta desenhada dentro do canvas --
// que com object-fit:contain nao e o canvas inteiro.
function desenharCaixa(box) {
  var c = $("caixa"), v = $("tela2d");
  var L = c.clientWidth, A = c.clientHeight;
  if (!L || !A) return;
  var r = window.devicePixelRatio || 1;
  if (c.width !== L * r || c.height !== A * r) { c.width = L * r; c.height = A * r; }
  var g = c.getContext("2d");
  g.setTransform(r, 0, 0, r, 0, 0);
  g.clearRect(0, 0, L, A);
  if (!box) return;
  var w = v.width || L, h = v.height || A;
  var k = Math.min(L / w, A / h) || 1;
  var lw = w * k, lh = h * k, mx = (L - lw) / 2, my = (A - lh) / 2;
  g.strokeStyle = "#7ee2a8";
  g.lineWidth = 2;
  g.strokeRect(mx + box.l * lw, my + box.t * lh,
               (box.r - box.l) * lw, (box.b - box.t) * lh);
}

// ------------------------------------------------------------- a curva
function desenharCurva() {
  var c = $("curva");
  var L = c.clientWidth || 320, A = 84;
  var r = window.devicePixelRatio || 1;
  if (c.width !== L * r || c.height !== A * r) { c.width = L * r; c.height = A * r; }
  var g = c.getContext("2d");
  g.setTransform(r, 0, 0, r, 0, 0);
  g.clearRect(0, 0, L, A);
  g.fillStyle = "#141414";
  g.fillRect(0, 0, L, A);
  if (!janela) return;

  var t0 = janela.t0, t1 = janela.t1, dt = Math.max(1, t1 - t0);
  var y0 = 8, y1 = A - 18;
  function px(ms) { return L * (ms - t0) / dt; }

  // Escala LOGARITMICA na vertical.
  //
  // Os scores andam por ordens de grandeza: o chao de ruido fica em 0,01% e um
  // vulto passando na frente da camera da 45%. Numa escala linear o pico ocupa a
  // altura toda e todo o resto -- inclusive a linha do limiar, que e o que se
  // esta ajustando -- fica esmagado contra o zero. Em log da para ver a
  // fronteira no meio do desenho e o que passa dela.
  var PISO = 0.0001;
  var topo = 0.02;
  amostras.forEach(function (a) { if (a.score > topo) topo = a.score; });
  topo *= 1.3;
  var l0 = Math.log(PISO), l1 = Math.log(topo);
  function py(v) {
    var lv = Math.log(Math.min(Math.max(v, PISO), topo));
    return y1 - (y1 - y0) * (lv - l0) / (l1 - l0);
  }

  // Cada amostra e uma barrinha, colorida pelo veredito ATUAL da barra de
  // sensibilidade. E este o desenho que muda enquanto se arrasta.
  var larg = amostras.length > 1 ? Math.max(1, L / amostras.length) : 2;
  amostras.forEach(function (a) {
    var q = classificar(a);
    g.fillStyle = q === "mexeu" ? "#7ee2a8"
                : (q === "cena" ? "#f2c14e" : "#3f4447");
    var x = px(a.ms), y = py(a.score);
    g.fillRect(x - larg / 2, y, larg, y1 - y);
  });

  // A fronteira que a barra de sensibilidade move.
  var yl = py(limiar());
  g.strokeStyle = "#8ed0f0";
  g.lineWidth = 1;
  g.setLineDash([4, 3]);
  g.beginPath(); g.moveTo(0, yl + 0.5); g.lineTo(L, yl + 0.5); g.stroke();
  g.setLineDash([]);

  g.fillStyle = "#c2c7c9";
  g.font = "10px Roboto, system-ui, sans-serif";
  var passo = escolherPasso(dt);
  var m = Math.ceil(t0 / passo) * passo;
  for (; m <= t1; m += passo) {
    var x = px(m);
    g.fillRect(x, y1, 1, 4);
    g.fillText(hhmmss(m).substr(0, 5), Math.min(x + 2, L - 30), A - 4);
  }

  // Onde a reproducao esta.
  if (posAtual >= t0 && posAtual <= t1) {
    g.fillStyle = "#fff";
    g.fillRect(px(posAtual) - 1, 0, 2, y1);
  }
}

function escolherPasso(span) {
  var p = [60, 300, 600, 900, 1800, 3600, 7200, 10800, 21600];
  for (var i = 0; i < p.length; i++)
    if (span / (p[i] * 1000) <= 8) return p[i] * 1000;
  return 43200000;
}

// ------------------------------------------------------------- o resumo
var GAP_EVENTO_MS = 8000;   // a mesma emenda da analise (analytics.mergeGapMs)

function atualizarResumo() {
  if (!amostras.length) { $("resumo").innerHTML = "&mdash;"; return; }
  var mexeu = 0, cena = 0, eventos = 0, ultimo = -1e15;
  amostras.forEach(function (a) {
    var q = classificar(a);
    if (q === "cena") { cena++; return; }
    if (q !== "mexeu") return;
    mexeu++;
    // Avistamentos proximos viram UM evento; sem emendar, a contagem assusta
    // sem motivo.
    if (a.ms - ultimo > GAP_EVENTO_MS) eventos++;
    ultimo = a.ms;
  });
  $("resumo").innerHTML =
    (eventos === 1 ? "<b>1</b> evento sairia"
                   : "<b>" + eventos + "</b> eventos sairiam") +
    " deste trecho &mdash; " + mexeu + " de " + amostras.length +
    " quadros acima do limiar" +
    (cena ? ", " + cena + " descartados como cena nova" : "");
}

function mostrarLimiar() {
  $("vlim").textContent = (limiar() * 100).toFixed(2) + "%";
  $("vcena").textContent = (cenaLimiar() * 100).toFixed(0) + "%";
}

// ------------------------------------------------------------- gravar
function aplicar() {
  function grava(chave, valor) {
    var sql = "insert into setting (key,value,updated_at_ms) values ('" +
      chave + "','" + valor + "', strftime('%s','now')*1000)" +
      " on conflict(key) do update set value=excluded.value," +
      " updated_at_ms=excluded.updated_at_ms";
    return fetch(api("/api/sql?q=" + encodeURIComponent(sql)));
  }
  msg("gravando...");
  Promise.all([
    grava("analytics.motionThreshold", limiar().toFixed(6)),
    grava("analytics.sceneChangeThreshold", cenaLimiar().toFixed(3))
  ]).then(function () {
    msg("gravado. Vale na pr\u00f3xima subida do servidor.");
  }).catch(function (e) {
    msg("n\u00e3o consegui gravar: " + e, "err");
  });
}

// Tocar a partir do ponto tocado na curva: e assim que se vai ver o que foi
// aquele pico.
(function () {
  var c = $("curva");
  c.addEventListener("pointerdown", function (ev) {
    if (!janela) return;
    var r = c.getBoundingClientRect();
    var f = (ev.clientX - r.left) / Math.max(1, r.width);
    abrirVideo(janela.t0 + (janela.t1 - janela.t0) *
               Math.min(1, Math.max(0, f)));
  });
})();

window.addEventListener("resize", function () {
  desenharCurva();
  atualizarSelo();
});

// Campo em foco visivel: o iframe rola por conta propria, e quem ajusta a area
// util com o teclado aberto e a casca.
document.addEventListener("focusin", function (ev) {
  var alvo = ev.target;
  if (!alvo || !/^(INPUT|SELECT|TEXTAREA)$/.test(alvo.tagName)) return;
  setTimeout(function () {
    try { alvo.scrollIntoView({ block: "center", behavior: "smooth" }); }
    catch (e) { alvo.scrollIntoView(); }
  }, 300);
});

      $("ate").value = paraInput(ATE_INICIAL);
      analisar(DE_INICIAL, ATE_INICIAL);
    }
    else ultimos(30);
  })
  .catch(function (e) {
    $("aviso").textContent = String(e.message || e);
    msg("n\u00e3o consegui come\u00e7ar: " + e, "err");
  });
