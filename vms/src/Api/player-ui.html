<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<!--
  O player de gravacao em HTML. Toca .vms direto: o vmsreader.js le o container,
  o player.js decodifica com WebCodecs e Web Audio.

  Servida em /ui/player, tanto pelo vmsserver quanto pelo servidor local do app.
  A mesma pagina, dois hospedeiros -- e por isso ela nunca cita endereco: tudo e
  relativo, e quem responde e quem serviu.

  ASCII puro (exigencia do tools/gen_ui_pas.py): acento por entidade na
  marcacao, e por escape unicode nas strings de JavaScript.
-->
<style>
  :root { color-scheme: dark; }
  html, body { height:100%; }
  body { margin:0; background:#0d0d0d; color:#e8e8e8; overflow:hidden;
         font:13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
         display:flex; flex-direction:column;
         -webkit-tap-highlight-color: transparent; }

  #palco { flex:1 1 auto; min-height:0; background:#000; position:relative;
           display:flex; align-items:center; justify-content:center; }
  /* object-fit no canvas para o video caber sem distorcer, seja qual for a
     resolucao que o decodificador entregar -- e ela varia por aparelho. */
  #tela { max-width:100%; max-height:100%; width:auto; height:auto;
          display:block; object-fit:contain; }
  #aviso { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
           text-align:center; color:#8a8a8a; font-size:13px; padding:0 16px; }

  #barra { flex:0 0 auto; display:flex; align-items:center; gap:6px;
           padding:8px; background:#1a1a1a; border-top:1px solid #2f2f2f;
           flex-wrap:wrap; }
  button { background:#2a2a2a; color:#e8e8e8; border:1px solid #3a3a3a;
           border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer; }
  button.on { background:#2d9cdb; border-color:#2d9cdb; color:#fff; }
  #hora { margin-left:auto; font-variant-numeric:tabular-nums; font-size:15px; }
  #estado { width:100%; color:#8a8a8a; font-size:11px;
            font-family:ui-monospace, Consolas, monospace;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .err { color:#f87171; }
</style>

<div id="palco">
  <canvas id="tela"></canvas>
  <div id="aviso">escolha uma c&acirc;mera</div>
</div>

<div id="barra">
  <button id="tocar">Pausar</button>
  <button id="menos">&minus;10s</button>
  <button id="mais">+10s</button>
  <button id="vel">1x</button>
  <button id="som">Som</button>
  <span id="hora">--:--:--</span>
  <span id="estado"></span>
</div>

<script src="/ui/vmsreader.js"></script>
<script src="/ui/player.js"></script>
<script>
"use strict";

var q = new URLSearchParams(location.search);
var CAMERA = q.get("camera") || "";
var INICIO = parseInt(q.get("ms") || "0", 10);
var ESQUEMA = q.get("scheme") || "";

function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function hora(ms) {
  var d = new Date(ms);
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function aviso(t, erro) {
  var a = $("aviso");
  a.textContent = t || "";
  a.style.display = t ? "" : "none";
  a.className = erro ? "err" : "";
}

var estadoTxt = "";
function estado(tipo, msg) {
  if (tipo === "erro") {
    $("estado").className = "err";
    $("estado").textContent = msg;
    aviso(msg, true);
    return;
  }
  $("estado").className = "";
  if (tipo === "codec") estadoTxt = msg;
  if (tipo === "aviso") aviso(msg);
  // O servidor pode abrir num instante diferente do pedido (fora da faixa
  // gravada, por exemplo). Dizer isso e melhor do que o usuario concluir que a
  // hora que ele digitou existe.
  if (tipo === "reancorado")
    estadoTxt += "   |   abriu em " + hora(msg) + ", e nao no instante pedido";
  $("estado").textContent = estadoTxt;
}

var posAtual = 0;
var tocador = new Player({
  base: "",                          // mesma origem de quem serviu a pagina
  canvas: $("tela"),
  onEstado: estado,
  onPosicao: function (ms) {
    posAtual = ms;
    $("hora").textContent = hora(ms);
    aviso("");
    // Avisa o app nativo, quando ha um. Iframe escondido pelo mesmo motivo da
    // faixa de eventos: o FMX avisa a navegacao mas nao a cancela.
    contarAoApp(ms);
  }
});

// Nao a cada quadro: seriam 15 navegacoes por segundo. Uma por segundo basta
// para a barra do tempo nativa acompanhar.
var ultimoAviso = 0, ponte = null;
function contarAoApp(ms) {
  if (!ESQUEMA) return;
  var agora = Date.now();
  if (agora - ultimoAviso < 1000) return;
  ultimoAviso = agora;
  if (!ponte) {
    ponte = document.createElement("iframe");
    ponte.style.display = "none";
    document.body.appendChild(ponte);
  }
  ponte.src = ESQUEMA + "://pos?ms=" + Math.round(ms) + "&t=" + agora;
}

var VELOCIDADES = [1, 2, 4, 8, 16];
var iVel = 0;

$("tocar").onclick = function () {
  if (tocador.tocando) { tocador.pausar(); this.textContent = "Tocar"; }
  else { tocador.retomar(); this.textContent = "Pausar"; }
};
$("menos").onclick = function () { if (posAtual) tocador.irPara(posAtual - 10000); };
$("mais").onclick = function () { if (posAtual) tocador.irPara(posAtual + 10000); };
$("vel").onclick = function () {
  iVel = (iVel + 1) % VELOCIDADES.length;
  tocador.setVelocidade(VELOCIDADES[iVel]);
  this.textContent = VELOCIDADES[iVel] + "x";
};
$("som").onclick = function () {
  var mudo = !tocador.mudo;
  tocador.setMudo(mudo);
  this.textContent = mudo ? "Mudo" : "Som";
  this.className = mudo ? "" : "on";
};
$("som").className = "on";

// O app chama isto por EvaluateJavaScript para mandar o player para um
// instante -- e o caminho contrario da ponte, o unico que o FMX faz bem.
window.vmsIrPara = function (ms) { tocador.irPara(ms); };
window.vmsAbrir = function (camera, ms) { tocador.abrir(camera, ms); };

var motivoSemDecoder = Player.motivoIndisponivel();
if (motivoSemDecoder) {
  aviso(motivoSemDecoder, true);
} else if (CAMERA && INICIO) {
  aviso("abrindo...");
  tocador.abrir(CAMERA, INICIO);
} else {
  aviso("informe ?camera=<nome>&ms=<instante>");
}
</script>
